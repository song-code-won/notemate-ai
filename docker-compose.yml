version: '3.8'

services:
  notemate-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notemate-ai
    ports:
      - "8000:8000"
    environment:
      # Connect to Ollama running on the host machine
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma3:1b
      - DATABASE_URL=sqlite:///./data/notes.db
      - WHISPER_MODEL_SIZE=tiny
      - WHISPER_DEVICE=cpu
    volumes:
      # Persist SQLite database and files across container restarts
      - ./data:/app/data
      - ./uploads:/app/app/uploads
    # Enables communication with host machine services (such as Ollama) on Linux and Docker Desktop
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
